<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周囲の受信数チェッカー</title>
<style>
:root{--bg:#0e1a1f;--panel:#16272e;--line:#2a4550;--ink:#e6f2f0;--sub:#8fb0b3;--ok:#5fe3b0;--warn:#ffc857}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.5rem;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 24px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 12px}
.big{font-size:3rem;font-weight:700;color:var(--ok);line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cell small{display:block;color:var(--sub)}
.cell b{font-size:1.2rem}
button{background:var(--ok);color:#06231a;border:0;border-radius:8px;padding:10px 16px;font-size:1rem;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button.stop{background:transparent;color:var(--ink);border:1px solid var(--line)}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
li span:last-child{color:var(--sub);white-space:nowrap}
.note{color:var(--warn);font-size:.9rem}
.msg{color:var(--sub);font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>周囲の受信数チェッカー</h1>
<p class="lead">この端末が今つかまえている電波の情報を表示します。</p>

<section>
<h2>回線の受信状態</h2>
<div class="grid" id="net"></div>
<p class="msg" id="netmsg"></p>
</section>

<section>
<h2>周囲のBluetooth機器</h2>
<div class="big" id="count">0</div>
<p class="msg">検出した機器の数(重複は1台として数えます)</p>
<p><button id="start">スキャン開始</button> <button id="stop" class="stop" hidden>停止</button></p>
<p class="msg" id="btmsg"></p>
<ul id="list"></ul>
</section>

<section>
<h2>できないこと</h2>
<p class="note">ブラウザからは、周囲のWi-Fiアクセスポイントの一覧や携帯基地局の数は取得できません(セキュリティ上の制限です)。それらを調べるには、Androidアプリや、Wi-Fiアダプタ付きのLinux上で動くサーバー側プログラムが必要です。</p>
</section>
</main>

<script>
// --- 回線情報 ---
const net = document.getElementById('net');
function cell(label, value){ return `<div class="cell"><small>${label}</small><b>${value}</b></div>`; }
function showNet(){
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(!c){
    document.getElementById('netmsg').textContent = 'このブラウザは回線情報の取得に対応していません(Chrome系で利用できます)。';
    net.innerHTML = cell('オンライン', navigator.onLine ? 'はい' : 'いいえ');
    return;
  }
  net.innerHTML =
    cell('回線タイプ', c.type || '不明') +
    cell('実効速度クラス', c.effectiveType || '不明') +
    cell('推定下り速度', (c.downlink ?? '-') + ' Mbps') +
    cell('往復遅延(RTT)', (c.rtt ?? '-') + ' ms') +
    cell('データ節約', c.saveData ? 'オン' : 'オフ');
}
showNet();
(navigator.connection || {}).onchange = showNet;
window.addEventListener('online', showNet);
window.addEventListener('offline', showNet);

// --- Bluetooth ---
const seen = new Map();
let scan = null;
const $ = id => document.getElementById(id);

function render(){
  $('count').textContent = seen.size;
  $('list').innerHTML = [...seen.values()]
    .sort((a,b)=>(b.rssi ?? -999)-(a.rssi ?? -999))
    .map(d=>`<li><span>${esc(d.name || '(名前なし)')}</span><span>${d.rssi ?? '-'} dBm</span></li>`)
    .join('');
}
function esc(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('start').onclick = async () => {
  if(!navigator.bluetooth){
    $('btmsg').textContent = 'このブラウザはWeb Bluetoothに対応していません。Chrome(PC/Android/Chromebook)をHTTPSで開いてください。';
    return;
  }
  if(!navigator.bluetooth.requestLEScan){
    $('btmsg').textContent = '周囲のスキャン機能が無効です。Chromeで chrome://flags/#enable-experimental-web-platform-features を有効にして再起動してください。';
    return;
  }
  try{
    scan = await navigator.bluetooth.requestLEScan({acceptAllAdvertisements:true, keepRepeatedDevices:true});
    navigator.bluetooth.addEventListener('advertisementreceived', e=>{
      seen.set(e.device.id, {name:e.device.name, rssi:e.rssi});
      render();
    });
    $('start').hidden = true; $('stop').hidden = false;
    $('btmsg').textContent = 'スキャン中…';
  }catch(err){
    $('btmsg').textContent = 'スキャンを開始できませんでした: ' + err.message;
  }
};
$('stop').onclick = () => {
  if(scan) scan.stop();
  $('start').hidden = false; $('stop').hidden = true;
  $('btmsg').textContent = '停止しました。';
};
</script>
</body>
</html>
