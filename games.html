<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>レーンラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1523;--panel:#16233a;--text:#eaf2ff}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  canvas{height:min(86vh,calc(100vw*600/360));aspect-ratio:360/600;max-width:100%;
    background:var(--panel);border-radius:12px;touch-action:none;display:block}
  p{margin:0;font-size:13px;opacity:.7}
</style>
</head>
<body>
<canvas id="c" width="360" height="600" aria-label="レーンラン ゲーム画面"></canvas>
<p>← → / A D / スワイプ / 画面の左右タップで移動</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=600,LX=[60,180,300],PY=520;
const FONT='"Dela Gothic One","Hiragino Sans",sans-serif';
let state='ready',lane=1,px=180,items=[],speed=4.5,dist=0,coins=0,spawn=0,stripe=0,overAt=0,best=0;
try{best=+localStorage.getItem('laneRunBest')||0}catch(e){}

function reset(){lane=1;px=180;items=[];speed=4.5;dist=0;coins=0;spawn=0;stripe=0;state='play'}
function score(){return Math.floor(dist/10)+coins*10}
function move(d){if(state==='play')lane=Math.max(0,Math.min(2,lane+d))}
function begin(){
  if(state==='ready'||(state==='over'&&performance.now()-overAt>500))reset();
}
function die(){
  state='over';overAt=performance.now();
  if(score()>best){best=score();try{localStorage.setItem('laneRunBest',best)}catch(e){}}
}

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d')move(1);
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();begin()}
});
let sx=0;
cv.addEventListener('pointerdown',e=>{sx=e.clientX});
cv.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx;
  if(state!=='play'){begin();return}
  if(Math.abs(dx)>30)move(dx>0?1:-1);
  else{const r=cv.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)}
});

function addRow(){
  const free=Math.floor(Math.random()*3);
  for(let i=0;i<3;i++){
    if(i===free){if(Math.random()<.6)items.push({l:i,y:-30,t:'coin'})}
    else if(Math.random()<.55)items.push({l:i,y:-30,t:'block'});
  }
}

function update(){
  if(state!=='play')return;
  speed=Math.min(13,speed+0.002);
  dist+=speed;stripe=(stripe+speed)%60;spawn+=speed;
  if(spawn>=190){spawn=0;addRow()}
  px+=(LX[lane]-px)*0.28;
  for(const it of items){it.y+=speed}
  for(const it of items){
    if(it.done)continue;
    const hit=Math.abs(LX[it.l]-px)<46&&it.y>PY-34&&it.y<PY+26;
    if(!hit)continue;
    if(it.t==='coin'){it.done=true;coins++}
    else{die();return}
  }
  items=items.filter(i=>!i.done&&i.y<H+40);
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function text(s,x,y,size,color,align='center'){
  ctx.font=size+'px '+FONT;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#16233a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#22345a';
  for(let y=-60+stripe;y<H;y+=60){ctx.fillRect(118,y,4,32);ctx.fillRect(238,y,4,32)}
  for(const it of items){
    const x=LX[it.l];
    if(it.t==='block'){ctx.fillStyle='#ff3d81';rr(x-38,it.y-20,76,40,8)}
    else{ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x,it.y,13,0,7);ctx.fill();
      ctx.fillStyle='#d9a800';ctx.beginPath();ctx.arc(x,it.y,6,0,7);ctx.fill()}
  }
  ctx.fillStyle='#2ee6c5';
  ctx.beginPath();ctx.moveTo(px,PY-26);ctx.lineTo(px+22,PY+22);ctx.lineTo(px-22,PY+22);ctx.closePath();ctx.fill();

  text(String(score()),16,40,28,'#eaf2ff','left');
  text('BEST '+best,W-16,36,15,'#8fa6cc','right');

  if(state==='ready'){
    ctx.fillStyle='rgba(13,21,35,.82)';ctx.fillRect(0,0,W,H);
    text('レーンラン',W/2,230,44,'#2ee6c5');
    text('ピンクの壁をよけて',W/2,290,16,'#eaf2ff');
    text('コインを集めよう',W/2,316,16,'#eaf2ff');
    text('タップかスペースでスタート',W/2,380,15,'#ffd23f');
  }
  if(state==='over'){
    ctx.fillStyle='rgba(13,21,35,.82)';ctx.fillRect(0,0,W,H);
    text('ゲームオーバー',W/2,230,34,'#ff3d81');
    text('スコア '+score(),W/2,290,26,'#eaf2ff');
    text('コイン '+coins+'枚 / ベスト '+best,W/2,324,15,'#8fa6cc');
    text('タップでもう一度',W/2,390,16,'#ffd23f');
  }
}

(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
